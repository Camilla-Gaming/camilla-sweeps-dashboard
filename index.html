<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camilla Sweeps - VIP 360° Command Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; font-family: 'Inter', sans-serif; }
    .glass-card { background: rgba(17, 24, 39, 0.8); border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="p-6">

  <!-- Header -->
  <header class="flex justify-between items-center mb-8 glass-card p-4 rounded-2xl">
    <div>
      <h1 class="text-2xl font-bold text-amber-400">CAMILLA SWEEPS</h1>
      <p class="text-xs text-gray-400">VIP 360° Command Center • Live System Active</p>
    </div>
    <div class="flex gap-3">
      <button onclick="loadDatabase()" class="bg-amber-500 hover:bg-amber-600 text-black font-semibold px-4 py-2 rounded-xl text-sm transition">
        <i class="fa-solid fa-rotate-right mr-2"></i>Refresh Data
      </button>
    </div>
  </header>

  <!-- Financial Overview Stats -->
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
    <div class="glass-card p-5 rounded-2xl">
      <p class="text-xs font-medium text-gray-400 uppercase">Total Active Players</p>
      <h2 id="stat-players" class="text-3xl font-bold text-white mt-1">0</h2>
      <p class="text-xs text-emerald-400 mt-1">Real Database Synced</p>
    </div>
    <div class="glass-card p-5 rounded-2xl">
      <p class="text-xs font-medium text-gray-400 uppercase">Lifetime Deposits</p>
      <h2 id="stat-deposits" class="text-3xl font-bold text-emerald-400 mt-1">$0.00</h2>
      <p class="text-xs text-gray-400 mt-1">Across all platforms</p>
    </div>
    <div class="glass-card p-5 rounded-2xl">
      <p class="text-xs font-medium text-gray-400 uppercase">Lifetime Cashouts</p>
      <h2 id="stat-cashouts" class="text-3xl font-bold text-amber-400 mt-1">$0.00</h2>
      <p class="text-xs text-gray-400 mt-1">Approved payouts</p>
    </div>
    <div class="glass-card p-5 rounded-2xl">
      <p class="text-xs font-medium text-gray-400 uppercase">Net House Win</p>
      <h2 id="stat-netwin" class="text-3xl font-bold text-blue-400 mt-1">$0.00</h2>
      <p id="stat-netwin-sub" class="text-xs text-emerald-400 mt-1">Operating Margin</p>
    </div>
  </div>

  <!-- Player Cards Grid -->
  <div id="players-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <!-- Dynamic Cards Will Load Here -->
  </div>

  <script>
    async function loadDatabase() {
      try {
        const response = await fetch('players.json?v=' + new Date().getTime());
        const players = await response.json();
        renderDashboard(players);
      } catch (err) {
        console.error("Error loading players.json:", err);
      }
    }

    function renderDashboard(players) {
      let totalDep = 0;
      let totalCash = 0;
      const grid = document.getElementById('players-grid');
      grid.innerHTML = '';

      players.forEach(p => {
        totalDep += p.deposits;
        totalCash += p.cashouts;
        const netWin = p.deposits - p.cashouts;

        grid.innerHTML += `
          <div class="glass-card p-6 rounded-2xl flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-start mb-4">
                <div>
                  <h3 class="text-xl font-bold text-white">${p.name}</h3>
                  <p class="text-xs text-amber-400">${p.handle}</p>
                </div>
                <span class="bg-amber-500/20 text-amber-400 border border-amber-500/40 text-xs px-3 py-1 rounded-full font-bold">${p.tier}</span>
              </div>
              <div class="grid grid-cols-3 gap-2 text-center bg-gray-900/60 p-3 rounded-xl mb-4">
                <div>
                  <p class="text-xs text-gray-400">Deposits</p>
                  <p class="text-sm font-bold text-emerald-400">$${p.deposits.toFixed(2)}</p>
                </div>
                <div>
                  <p class="text-xs text-gray-400">Cashouts</p>
                  <p class="text-sm font-bold text-amber-400">$${p.cashouts.toFixed(2)}</p>
                </div>
                <div>
                  <p class="text-xs text-gray-400">Net Win</p>
                  <p class="text-sm font-bold ${netWin >= 0 ? 'text-blue-400' : 'text-rose-400'}">${netWin >= 0 ? '$' + netWin.toFixed(2) : '-$' + Math.abs(netWin).toFixed(2)}</p>

                </div>
              </div>
              <div class="text-xs text-gray-400 space-y-1">
                <p><span class="text-gray-500">Payout Handle:</span> <span class="text-white">${p.cashoutChannel}</span></p>
                <p><span class="text-gray-500">Signup Match:</span> <span class="text-emerald-400 font-bold">${p.matchUsed}/5 Used</span></p>
                <p class="mt-2 text-gray-300 italic bg-black/30 p-2 rounded-lg">"${p.notes || 'No notes added'}"</p>
              </div>
            </div>
          </div>
        `;
      });

      const totalNet = totalDep - totalCash;
      document.getElementById('stat-players').innerText = players.length;
      document.getElementById('stat-deposits').innerText = '$' + totalDep.toFixed(2);
      document.getElementById('stat-cashouts').innerText = '$' + totalCash.toFixed(2);
      document.getElementById('stat-netwin').innerText = '$' + totalNet.toFixed(2);
    }

    // Auto load on page start
    loadDatabase();
  </script>
</body>
</html>
