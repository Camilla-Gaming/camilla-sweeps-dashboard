<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camilla Promos - Lucky 13 Halloween Mystery Wheel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; font-family: 'Inter', sans-serif; overflow-x: hidden; }
    .glass-card { background: rgba(17, 24, 39, 0.85); border: 1px solid rgba(245, 158, 11, 0.2); backdrop-filter: blur(12px); }
    .wheel-container { position: relative; width: 320px; height: 320px; margin: 0 auto; }
    #wheel { width: 100%; height: 100%; border-radius: 50%; border: 4px solid #f59e0b; transition: transform 4s cubic-bezier(0.15, 0.9, 0.15, 1); box-shadow: 0 0 25px rgba(245, 158, 11, 0.4); }
    .pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 25px solid #ef4444; z-index: 20; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }
  </style>
</head>
<body class="p-4 sm:p-6 min-h-screen flex flex-col items-center justify-center relative">

  <!-- Background Decorative Glows -->
  <div class="absolute top-10 left-1/2 -translate-x-1/2 w-72 h-72 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

  <div class="max-w-md w-full glass-card p-6 rounded-3xl text-center space-y-6 shadow-2xl relative z-10 my-auto">
    
    <!-- Title & Brand -->
    <div>
      <span class="bg-amber-500/20 text-amber-400 border border-amber-500/40 text-[10px] uppercase tracking-widest font-extrabold px-3 py-1 rounded-full">
        🎃 Halloween Spooktacular 🎃
      </span>
      <h1 class="text-2xl font-black text-amber-400 mt-2">LUCKY 13 MYSTERY WHEEL</h1>
      <p class="text-xs text-gray-400 mt-1">Enter your admin passcode to unlock your 1-time spin!</p>
    </div>

    <!-- User Input Section -->
    <div id="username-step" class="space-y-3">
      <div class="text-left space-y-2">
        <div>
          <label class="block text-xs font-bold text-gray-300 mb-1">Spin Passcode:</label>
          <input type="text" id="player-code" placeholder="" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm text-amber-400 uppercase font-black tracking-wider focus:outline-none focus:border-amber-400 transition">
        </div>
      </div>
      <button id="verify-btn" onclick="startWheelSession()" class="w-full bg-amber-500 hover:bg-amber-600 text-black font-extrabold py-3 rounded-xl text-sm transition shadow-lg shadow-amber-500/20 flex items-center justify-center mt-2">
        <i class="fa-solid fa-key mr-2"></i> Verify Passcode & Unlock Wheel
      </button>
    </div>

    <!-- Interactive Wheel Display -->
    <div id="wheel-section" class="hidden space-y-6">
      <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="320" height="320"></canvas>
      </div>

      <button id="spin-btn" onclick="spinWheel()" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-black font-black py-3.5 rounded-xl text-base transition shadow-xl shadow-amber-500/30">
        🎰 SPIN FOR HALLOWEEN MATCH 🎃
      </button>
    </div>

    <!-- Result Banner -->
    <div id="result-box" class="hidden p-5 bg-gradient-to-br from-amber-950/60 to-gray-900 border border-amber-500/50 rounded-2xl space-y-3">
      <span class="text-xs text-amber-400 uppercase font-bold tracking-wider">🎉 CONGRATULATIONS 🎉</span>
      <h2 id="result-text" class="text-2xl font-black text-white">100% MATCH</h2>
      <p id="result-sub" class="text-xs text-gray-300">Your bonus code has been generated.</p>

      <button onclick="copyAndClaim()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-black font-extrabold py-3 rounded-xl text-xs transition flex items-center justify-center shadow-lg shadow-emerald-500/20">
        <i class="fa-solid fa-copy mr-2"></i> Copy Claim Code & Message Admin
      </button>
    </div>

    <!-- Rules Notice -->
    <div class="text-[10px] text-gray-500 pt-2 border-t border-gray-800/60">
      *Requires a valid admin passcode. Limit 1 spin per passcode.
    </div>
  </div>

  <script>
    const validCodes = [
      "CAMILLA-1011", "CAMILLA-1022", "CAMILLA-1033", "CAMILLA-1044", "CAMILLA-1055",
      "CAMILLA-1066", "CAMILLA-1077", "CAMILLA-1088", "CAMILLA-1099", "CAMILLA-1100",
      "CAMILLA-2011", "CAMILLA-2022", "CAMILLA-2033", "CAMILLA-2044", "CAMILLA-2055",
      "CAMILLA-2066", "CAMILLA-2077", "CAMILLA-2088", "CAMILLA-2099", "CAMILLA-2200",
      "CAMILLA-3011", "CAMILLA-3022", "CAMILLA-3033", "CAMILLA-3044", "CAMILLA-3055",
      "CAMILLA-3066", "CAMILLA-3077", "CAMILLA-3088", "CAMILLA-3099", "CAMILLA-3300",
      "CAMILLA-4011", "CAMILLA-4022", "CAMILLA-4033", "CAMILLA-4044", "CAMILLA-4055",
      "CAMILLA-4066", "CAMILLA-4077", "CAMILLA-4088", "CAMILLA-4099", "CAMILLA-4400",
      "CAMILLA-5011", "CAMILLA-5022", "CAMILLA-5033", "CAMILLA-5044", "CAMILLA-5055",
      "CAMILLA-5066", "CAMILLA-5077", "CAMILLA-5088", "CAMILLA-5099", "CAMILLA-5500"
    ];

    const slices = [
      { label: "40% MATCH", bonus: "40%" },
      { label: "50% MATCH", bonus: "50%" },
      { label: "60% MATCH", bonus: "60%" },
      { label: "45% MATCH", bonus: "45%" },
      { label: "70% MATCH", bonus: "70%" },
      { label: "55% MATCH", bonus: "55%" },
      { label: "80% MATCH", bonus: "80%" },
      { label: "40% MATCH", bonus: "40%" },
      { label: "65% MATCH", bonus: "65%" },
      { label: "50% MATCH", bonus: "50%" },
      { label: "75% MATCH", bonus: "75%" },
      { label: "55% MATCH", bonus: "55%" },
      { label: "👑 100% JACKPOT!", bonus: "100%" }
    ];

    let currentCode = "";
    let finalOutcome = null;

    function drawWheel() {
      const canvas = document.getElementById("wheel");
      const ctx = canvas.getContext("2d");
      const numSlices = slices.length;
      const arc = (2 * Math.PI) / numSlices;
      const colors = ["#1e293b", "#f59e0b", "#0f172a", "#d97706", "#334155"];

      ctx.clearRect(0, 0, 320, 320);

      for (let i = 0; i < numSlices; i++) {
        const angle = i * arc;
        ctx.beginPath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.moveTo(160, 160);
        ctx.arc(160, 160, 155, angle, angle + arc);
        ctx.lineTo(160, 160);
        ctx.fill();
        ctx.lineWidth = 1;
        ctx.strokeStyle = "#0b0f19";
        ctx.stroke();

        ctx.save();
        ctx.translate(160, 160);
        ctx.rotate(angle + arc / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 10px Inter, sans-serif";
        ctx.fillText(slices[i].label, 145, 4);
        ctx.restore();
      }
    }

    async function startWheelSession() {
      const codeInput = document.getElementById("player-code").value.trim().toUpperCase();

      if (!codeInput) {
        alert("Please enter your Spin Passcode provided by the admin!");
        return;
      }

      if (!validCodes.includes(codeInput)) {
        alert("Invalid Passcode! Please message our page on Facebook/Telegram to get a valid spin code.");
        return;
      }

      const verifyBtn = document.getElementById("verify-btn");
      verifyBtn.disabled = true;
      verifyBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Checking Passcode...`;

      // 1. Check Global halloween.json on GitHub
      try {
        const response = await fetch('halloween.json?v=' + new Date().getTime());
        if (response.ok) {
          const burnedList = await response.json();
          const burned = burnedList.find(item => item.passcode === codeInput);
          if (burned) {
            alert(`Passcode "${codeInput}" has ALREADY been used globally! Code burned.`);
            verifyBtn.disabled = false;
            verifyBtn.innerHTML = `<i class="fa-solid fa-key mr-2"></i> Verify Passcode & Unlock Wheel`;
            return;
          }
        }
      } catch (err) {
        console.log("Could not load halloween.json, checking local storage...");
      }

      // 2. Local Storage Backup Check
      const usedCodes = JSON.parse(localStorage.getItem("camilla_used_codes")) || {};
      if (usedCodes[codeInput]) {
        alert(`Passcode "${codeInput}" has ALREADY been used on this device!`);
        verifyBtn.disabled = false;
        verifyBtn.innerHTML = `<i class="fa-solid fa-key mr-2"></i> Verify Passcode & Unlock Wheel`;
        return;
      }

      currentCode = codeInput;

      document.getElementById("username-step").classList.add("hidden");
      document.getElementById("wheel-section").classList.remove("hidden");
      drawWheel();
    }

    function spinWheel() {
      const spinBtn = document.getElementById("spin-btn");
      spinBtn.disabled = true;
      spinBtn.classList.add("opacity-50", "cursor-not-allowed");

      const wheel = document.getElementById("wheel");
      const numSlices = slices.length;
      const sliceDeg = 360 / numSlices;

      const winningIndex = Math.floor(Math.random() * numSlices);
      finalOutcome = slices[winningIndex];

      const sliceCenterDeg = winningIndex * sliceDeg + (sliceDeg / 2);
      const stopDeg = (270 - sliceCenterDeg + 360) % 360;
      const totalDegrees = 1800 + stopDeg;

      wheel.style.transform = `rotate(${totalDegrees}deg)`;

      setTimeout(() => {
        const claimCode = `HALLOWEEN-${finalOutcome.bonus}-${currentCode}`;
        const spinData = {
          passcode: currentCode,
          bonus: finalOutcome.bonus,
          label: finalOutcome.label,
          claimCode: claimCode,
          date: new Date().toISOString()
        };

        // Save local burn
        const usedCodes = JSON.parse(localStorage.getItem("camilla_used_codes")) || {};
        usedCodes[currentCode] = spinData;
        localStorage.setItem("camilla_used_codes", JSON.stringify(usedCodes));

        displayResult(spinData);
      }, 4100);
    }

    function displayResult(spinData) {
      document.getElementById("spin-btn").classList.add("hidden");
      const resultBox = document.getElementById("result-box");
      resultBox.classList.remove("hidden");
      document.getElementById("result-text").innerText = `${spinData.label}`;
      document.getElementById("result-sub").innerText = `Claim Code: ${spinData.claimCode}`;
    }

    function copyAndClaim() {
      const usedCodes = JSON.parse(localStorage.getItem("camilla_used_codes")) || {};
      const data = usedCodes[currentCode] || { label: finalOutcome.label, claimCode: `HALLOWEEN-${finalOutcome.bonus}-${currentCode}`, passcode: currentCode };
      const claimText = `🎃 HALLOWEEN WHEEL CLAIM 🎃\nOutcome: ${data.label}\nClaim Code: ${data.claimCode}\nPasscode: ${data.passcode}\nReady to load my deposit match!`;

      navigator.clipboard.writeText(claimText);
      alert("Claim details copied to clipboard! Paste it directly to our Facebook Messenger or Telegram chat to claim your bonus!");
    }
  </script>
</body>
</html>
